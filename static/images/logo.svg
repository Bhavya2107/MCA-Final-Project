<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <title>Computer CCTV Hub Shield Logo</title>
  <defs>
    <!-- Screen glow gradient -->
    <radialGradient id="screenGlow" cx="40%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#1a4fd6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#061440" stop-opacity="1"/>
    </radialGradient>
    <!-- Cable gradient -->
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="60%" stop-color="#2a6ed4"/>
      <stop offset="100%" stop-color="#0a1e5e"/>
    </linearGradient>
    <!-- Shield clip -->
    <clipPath id="shieldClip">
      <path d="M250 48 L405 100 L405 272 Q405 385 250 462 Q95 385 95 272 L95 100 Z"/>
    </clipPath>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="500" height="500" fill="#0d1b4b"/>

  <!-- ── SHIELD FILL ── -->
  <path d="M250 48 L405 100 L405 272 Q405 385 250 462 Q95 385 95 272 L95 100 Z"
        fill="#112060"/>

  <!-- ── SHIELD OUTER BORDER ── -->
  <path d="M250 30 L425 88 L425 272 Q425 400 250 480 Q75 400 75 272 L75 88 Z"
        fill="none" stroke="white" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ── SHIELD INNER BORDER ── -->
  <path d="M250 56 L402 106 L402 272 Q402 380 250 454 Q98 380 98 272 L98 106 Z"
        fill="none" stroke="white" stroke-width="4" stroke-linejoin="round" opacity="0.35"/>

  <!-- ══════════════════════════════════
       COMPUTER MONITOR
  ══════════════════════════════════ -->
  <!-- Monitor outer casing -->
  <rect x="108" y="138" width="220" height="158" rx="12" fill="white"/>
  <!-- Screen area -->
  <rect x="120" y="150" width="196" height="126" rx="6" fill="url(#screenGlow)"/>

  <!-- ── ETHERNET CABLES ON SCREEN ── -->
  <!-- Cable 1 - top, bright blue -->
  <path d="M120 182 C160 170, 220 178, 316 188" stroke="url(#cableGrad)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- Cable 1 shadow -->
  <path d="M120 186 C160 174, 220 182, 316 192" stroke="#0a1e5e" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Cable 2 -->
  <path d="M120 200 C155 190, 220 196, 316 208" stroke="url(#cableGrad)" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M120 204 C155 194, 220 200, 316 212" stroke="#0a1e5e" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Cable 3 -->
  <path d="M120 218 C155 208, 220 215, 316 228" stroke="#2255bb" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M120 222 C155 212, 220 219, 316 232" stroke="#061030" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Cable 4 - lower, darker -->
  <path d="M120 236 C155 226, 220 233, 316 246" stroke="#1a3ea0" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M120 240 C155 230, 220 237, 316 250" stroke="#061030" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Cable ends (RJ45 plugs on right) -->
  <rect x="308" y="182" width="18" height="12" rx="3" fill="#4a9eff"/>
  <rect x="308" y="200" width="18" height="12" rx="3" fill="#4a9eff"/>
  <rect x="308" y="220" width="18" height="12" rx="3" fill="#2a6ed4"/>
  <rect x="308" y="238" width="18" height="12" rx="3" fill="#1a3ea0"/>

  <!-- Cable pin lines on plugs -->
  <line x1="311" y1="184" x2="311" y2="192" stroke="white" stroke-width="1.2" opacity="0.7"/>
  <line x1="314" y1="184" x2="314" y2="192" stroke="white" stroke-width="1.2" opacity="0.7"/>
  <line x1="317" y1="184" x2="317" y2="192" stroke="white" stroke-width="1.2" opacity="0.7"/>
  <line x1="320" y1="184" x2="320" y2="192" stroke="white" stroke-width="1.2" opacity="0.7"/>
  <line x1="311" y1="202" x2="311" y2="210" stroke="white" stroke-width="1.2" opacity="0.7"/>
  <line x1="314" y1="202" x2="314" y2="210" stroke="white" stroke-width="1.2" opacity="0.7"/>
  <line x1="317" y1="202" x2="317" y2="210" stroke="white" stroke-width="1.2" opacity="0.7"/>
  <line x1="320" y1="202" x2="320" y2="210" stroke="white" stroke-width="1.2" opacity="0.7"/>

  <!-- Screen bezel bottom bar -->
  <rect x="120" y="258" width="196" height="18" rx="0" fill="#0a1635" opacity="0.8"/>
  <!-- Status lights -->
  <circle cx="135" cy="267" r="4" fill="#4a9eff" opacity="0.9"/>
  <circle cx="148" cy="267" r="4" fill="#17c3b2" opacity="0.9"/>

  <!-- Monitor stand neck -->
  <rect x="208" y="296" width="20" height="22" rx="4" fill="white"/>
  <!-- Monitor stand base -->
  <rect x="170" y="316" width="96" height="13" rx="7" fill="white"/>

  <!-- ══════════════════════════════════
       CCTV BULLET CAMERA (right side, overlapping monitor)
  ══════════════════════════════════ -->

  <!-- Vertical wall mount -->
  <rect x="338" y="148" width="20" height="82" rx="6" fill="white"/>
  <!-- Horizontal arm -->
  <rect x="310" y="148" width="50" height="20" rx="6" fill="white"/>

  <!-- Camera body -->
  <rect x="272" y="195" width="125" height="54" rx="16" fill="white"/>

  <!-- Lens housing circle -->
  <circle cx="278" cy="222" r="30" fill="white"/>
  <!-- Lens outer dark ring -->
  <circle cx="278" cy="222" r="24" fill="#112060"/>
  <!-- Lens mid ring -->
  <circle cx="278" cy="222" r="16" fill="#0a1430"/>
  <!-- Lens inner blue -->
  <circle cx="278" cy="222" r="9" fill="#2a5fd4"/>
  <!-- Lens center -->
  <circle cx="278" cy="222" r="4" fill="#061030"/>
  <!-- Lens glint -->
  <circle cx="271" cy="215" r="4" fill="white" opacity="0.55"/>
  <circle cx="268" cy="212" r="2" fill="white" opacity="0.3"/>

  <!-- Camera body grip lines -->
  <rect x="355" y="203" width="7" height="38" rx="3" fill="#dde4f5"/>
  <rect x="366" y="203" width="7" height="38" rx="3" fill="#dde4f5"/>
  <rect x="377" y="203" width="7" height="38" rx="3" fill="#dde4f5"/>

  <!-- Camera screw detail -->
  <circle cx="390" cy="210" r="5" fill="#c0cce8"/>
  <circle cx="390" cy="238" r="5" fill="#c0cce8"/>

</svg>
